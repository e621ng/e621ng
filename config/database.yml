default: &default
  adapter: postgresql
  timeout: 5000
  username: e621
  variables:
    statement_timeout: 10000

development:
  <<: *default
  database: e621_development
  host: postgres
  # Covers the Procfile sidekiq process: default capsule (5) + media (2) + iqdb (1)
  pool: 10

eris:
  <<: *default
  database: eris
  password: <%= ENV["ERIS_DB_PASSWORD"] %>
  host: <%= ENV.fetch("ERIS_DB_HOST", "postgres") %>
  port: <%= ENV.fetch("ERIS_DB_PORT", "5432") %>

test:
  <<: *default
  database: e621_test<%= ENV["TEST_ENV_NUMBER"] %>
  host: postgres
  pool: 5

<% if Rails.env.production? %>
production:
  <<: *default
  database: e621
  password: <%= ENV.fetch("DB_PASSWORD") %>
  host: <%= ENV.fetch("DB_HOST") %>
  port: <%= ENV.fetch("DB_PORT") %>
  pool: <%= Sidekiq.server? ? ENV.fetch("DB_WORKER_POOL_SIZE") : ENV.fetch("DB_POOL_SIZE") %>
<% end %>
